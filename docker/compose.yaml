# Two containers and one deliberate hole in the wall.
#
# `factory` has a shell, a compiler, and a long-lived Claude token. It sits on
# a network with NO route off the machine. The only way out is `egress`, which
# forwards to an anchored denylist and logs every request it passed.
#
# That is the whole security model, and it is structural: an agent that talks
# its way past every tool check still has nowhere to send anything.
#
#   cp .env.example .env        # then put your token in it
#   docker compose up --build
#
name: riff

services:
  factory:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # keyproxy gated on health so a shift never races a proxy that is not yet
    # listening; egress only needs to have started.
    depends_on:
      egress:
        condition: service_started
      keyproxy:
        condition: service_healthy
    networks: [walled]
    # No published port here on purpose. A container attached only to an
    # internal network cannot be NAT-ed into either — no gateway means no
    # ingress as well as no egress — and Docker publishes nothing, silently.
    # The `ingress` service below carries the console out instead.
    environment:
      # Two ways in, and they are not equivalent.
      #
      # RIFF_CREDENTIALS_CMD (preferred) prints your login's credentials
      # RECORD, which up.sh pushes onto this container's tmpfs after start.
      # The record carries the subscription alongside the token, so the
      # runtime can read what is left of the plan and pace on it.
      #
      # CLAUDE_CODE_OAUTH_TOKEN is a bare `claude setup-token` string. It
      # still works, and the plan stays invisible: rate limits come back
      # empty, the throttle has nothing to govern on, and every shift is
      # recorded with `planVisible: no`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Set by up.sh when it has a record to push. Makes the entrypoint wait
      # for it rather than starting companies with no credentials at all.
      RIFF_WAIT_FOR_CREDENTIALS: ${RIFF_WAIT_FOR_CREDENTIALS:-}
      # The installation root. Must stay under the mount, or companies are
      # written to the container's own filesystem and lost on restart.
      RIFF_ROOT: /data
      # Only used when the installation is empty, to name the first company.
      RIFF_COMPANY: ${RIFF_COMPANY:-Untitled Company}
      RIFF_BUSINESS: ${RIFF_BUSINESS:-}
      RIFF_CHAIR: ${RIFF_CHAIR:-Chair}
      RIFF_CEO: ${RIFF_CEO:-CEO}
      # Everything that speaks HTTP reads these. Anything that ignores them
      # still has no route — the network is internal.
      HTTP_PROXY: http://egress:8888
      HTTPS_PROXY: http://egress:8888
      http_proxy: http://egress:8888
      https_proxy: http://egress:8888
      # keyproxy is internal and holds a company's own keys; its calls must go
      # to it DIRECT, not out through egress, so it is exempt here alongside the
      # loopback names. A product reaches it at http://keyproxy:8890.
      NO_PROXY: localhost,127.0.0.1,egress,keyproxy
      no_proxy: localhost,127.0.0.1,egress,keyproxy
    # Docker Desktop maps bind-mount ownership, so on macOS the image's own
    # unprivileged user writes files that come back owned by you. A rootful
    # Linux daemon does not map anything — uncomment this and set UID/GID in
    # docker/.env to run as yourself. The entrypoint says so if it matters.
    # user: "${UID:-10001}:${GID:-10001}"
    volumes:
      # THE SAME ~/.riff the host uses. One installation, not two — the
      # layout is identical either way, so a company founded on the host is
      # simply there when you start the container, and the other way round.
      #
      # A bind mount rather than a named volume, so every company stays an
      # ordinary directory on your disk: readable without Docker, backed up by
      # whatever already backs up your home folder, and still there when the
      # container is thrown away.
      - ${RIFF_DATA:-${HOME}/.riff}:/data
    restart: unless-stopped
    # An agent shell should not be able to fork-bomb the host or read the
    # kernel keyring on the way to a privilege escalation.
    # The default seccomp profile, plus one group: unshare/clone with the
    # namespace flags, which Docker allowlists only alongside CAP_SYS_ADMIN.
    # Claude Code's Bash sandbox is bubblewrap on Linux, and bubblewrap is
    # built on unprivileged user namespaces, so without this the sandbox
    # cannot start in ANY container — measured on a plain `docker run` with no
    # hardening at all, not only on this hardened one.
    #
    # It is a real widening: unprivileged user namespaces are the richest
    # container-escape CVE class of the last decade. What it buys is the
    # boundary between one company and another, which nothing else in this
    # file provides. On macOS a LinuxKit VM sits under all of this; on a Linux
    # host it does not, and SECURITY.md says so.
    security_opt:
      - 'no-new-privileges:true'
      - seccomp=./seccomp-userns.json
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 4g
    # Everything the factory needs to write is under /data and these. The rest
    # of the filesystem is read-only, so an agent cannot rewrite its own image.
    read_only: true
    # A tmpfs mounts root-owned by default, and the factory runs as labs
    # (10001). /home/labs is the CLI's session store: unwritable, it silently
    # keeps no transcripts, so every resume fails and every shift starts cold.
    # It did — 33 resume attempts, 33 resets, 0 successes — while the feature
    # looked present and the container looked healthy.
    #
    # The transcripts stay here, and are therefore emptied by every restart
    # while the session ids in the ledger survive on the volume. Both ways of
    # moving them were measured on 2026-09-08 and both cost more than they
    # bought: CLAUDE_CONFIG_DIR moves the credentials lookup with them, which
    # would put the subscription token on the operator's disk (`Not logged in
    # · Please run /login`), and a symlink out of $HOME stops bubblewrap dead
    # — `Can't mount on symlink destination` — which took the shell away from
    # a whole shift. tick() checks the store before resuming instead, so a
    # transcript that is gone costs a cold start and nothing else.
    tmpfs:
      - /tmp:size=512m,uid=10001,gid=10001,mode=1777
      - /home/labs:size=256m,uid=10001,gid=10001,mode=0700
      - /app/node_modules/.cache:size=128m,uid=10001,gid=10001,mode=0755
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4173/api/companies').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # The only way IN. A dumb TCP forwarder: no token, no agent code, no shell
  # worth having. It is attached to a routable network because publishing a
  # port requires one — which is precisely why the factory is not.
  ingress:
    image: alpine/socat:1.8.0.0
    depends_on: [factory]
    networks: [walled, outside]
    ports: ['127.0.0.1:${PORT:-4173}:4173']
    command: ['-d', 'TCP-LISTEN:4173,fork,reuseaddr', 'TCP:factory:4173']
    restart: unless-stopped
    user: nobody
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 64m

  # The key-injecting proxy. It holds the real per-company keys and the master
  # key that unwraps them, so the FACTORY never does — the one structural way to
  # keep a credential a shift genuinely cannot read (SECURITY.md: anything in the
  # factory box is readable by a shell that has run long enough). A product calls
  # http://keyproxy:8890/svc/<service>/... with a per-shift SCOPED token; the
  # proxy verifies it, swaps in the real key on the way out, and forwards. Same
  # image as the factory for one Node/TS runtime, a different command, and NONE
  # of the factory's environment: no Claude token, no agent, no shell anyone
  # reaches. The data volume is read-only — a key-holder that cannot alter the
  # routes it authorises against is one less thing to reason about.
  keyproxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # The minimal stage — Node + ca-certificates + src only. NOT the factory
      # image: the one container that can decrypt every company's keys does not
      # also carry bash, a compiler, a browser, or the Claude CLI.
      target: keyproxy
    # Docker's own init as PID 1 for signal handling; the minimal image ships no
    # tini and the proxy spawns no children to reap.
    init: true
    networks: [walled, outside]
    environment:
      RIFF_ROOT: /data
      KEYPROXY_PORT: 8890
    volumes:
      - ${RIFF_DATA:-${HOME}/.riff}:/data:ro
    restart: unless-stopped
    security_opt:
      - 'no-new-privileges:true'
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1777
      - /home/labs:size=64m,uid=10001,gid=10001,mode=0700
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8890/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  egress:
    build:
      context: proxy
    # Runs as the unprivileged user from the start. See tinyproxy.conf: with
    # every capability dropped there is no way to drop privileges later.
    user: tinyproxy
    networks: [walled, outside]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/var/run/tinyproxy', '/tmp']
    cap_drop: [ALL]

networks:
  # No gateway. Containers here reach each other and nothing else.
  walled:
    internal: true
  # Only the proxy is attached to this one.
  outside: {}
