# ----------------------------------------------------------- CLI telemetry
#
# The Claude CLI in every shift shipped its own logs here — 30 connections in
# a half hour of ShipIt on 2026-09-23 — through this proxy, around the keyproxy.
# Shifts now run with CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1, and a probe
# shift made no direct connection with it; this is the net under that setting,
# for a CLI version that stops honouring it. api.anthropic.com is not listed:
# the keyproxy's own requests need it.
http-intake.logs.us5.datadoghq.com

# ---------------------------------------------------------------- notes
#
# Deliberately NOT here:
#
# URL shorteners. They would be an exfiltration channel, but blocking them also
# breaks reading anything a page links through one, and a shortener is a worse
# channel than the paste sites above are. Not worth the false positives.
#
# Social and messaging platforms. They take a credential, and the container
# holds none for any of them. A post attempt fails on its own.
#
# A public blocklist. The maintained ones — StevenBlack, ad and tracker lists,
# malware C2 feeds — solve the opposite problem: they protect a browser from
# content ARRIVING. Our exposure is a payload LEAVING to a host with a spotless
# reputation, which no such list contains. They also run to six figures of
# entries, and tinyproxy tests every rule as its own anchored regex on every
# request. A vendor's pricing page landing on an ad-adjacent list would
# reproduce exactly the failure that caused this flip.
#
# An operator's own additions go in denylist.local.conf, which is gitignored and
# appended at build time. That is where a public list belongs if you want one —
# on your installation, with the cost yours to measure.
