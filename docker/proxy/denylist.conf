# Egress denylist.
#
# The factory sits on an `internal: true` network and reaches the internet only
# through this proxy. Until 2026-09-03 this file was an ALLOWLIST and the proxy
# was default-deny.
#
# What changed, and why: a researcher spent a whole shift and four sub-agents —
# 195 external.read calls, every one of them allowed by the gate — and fetched
# exactly one host successfully. The company was asked for real prices from real
# pricing pages and could not read a single one. It came back with a ninefold
# spread on one vendor's figure, which is the difference between a market and no
# market. A curated list cannot anticipate which vendor a company will need to
# price next, and adding them one request at a time was going to arrive here
# anyway, a fortnight later and by accretion.
#
# BE CLEAR ABOUT WHAT THIS COSTS. The old file claimed the proxy was what kept a
# readable token from being sent anywhere. That claim is now retired, and it was
# always softer than it read: every allowlisted host accepted a GET with a query
# string, so wikipedia and arxiv were exfiltration channels too. Read SECURITY.md
# for what actually holds the line now.
#
# So this list is HYGIENE, not containment. It blocks the hosts whose entire
# purpose is to receive data from a stranger, which is enough to stop drift and
# accident and is not claimed to stop intent.
#
# One host per line. Subdomains need their own entry.

